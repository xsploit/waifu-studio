[package]
name = "waifu-studio"
version = "0.1.0-preview.5"
edition = "2024"
rust-version = "1.95"
description = "A native Rust character companion studio with VRM, chat, desktop overlay and configurable speech"
license = "MIT"

[dependencies]
wgpu = { version = "29", default-features = false }
bevy = { version = "=0.19.0", default-features = false, features = ["default_app", "3d_bevy_render", "mesh_picking", "bevy_world_serialization", "bevy_winit", "multi_threaded", "x11", "wayland", "png", "jpeg", "bevy_audio", "wav", "mp3"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
bevy_vrm = { path = "vendor/crates/bevy_vrm" }
bevy_shader_mtoon = { path = "vendor/crates/bevy_shader_mtoon" }
serde_vrm = { path = "vendor/crates/serde_vrm", features = ["bevy"] }
gltf = { version = "1.4.1", default-features = false, features = ["extensions", "names", "utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
bytemuck = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rmpv = "1.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cpal = "0.17"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic"] }
rodio = { version = "0.22", default-features = false, features = ["wav", "mp3"] }
rfd = "0.15"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
pdf-extract = "0.12.1"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.38"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_SystemInformation"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
bevy_render = { path = "vendor/crates/bevy_render" }
bevy_mesh = { path = "vendor/crates/bevy_mesh" }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
